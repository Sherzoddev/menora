name: keepalive
# Render free tier sleeps after 15 min without traffic; ping so Telegram webhooks answer fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://menora-m.onrender.com/api/telegram/admin || true
